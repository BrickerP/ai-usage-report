name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  collector:
    # macOS is required: tests/test_daily_reconciliation.py exercises
    # scripts/launchd-run, which depends on /usr/bin/shlock (absent on Linux),
    # and macOS-specific publish/git behavior; 7 tests fail on Linux.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@users.noreply.github.com
    concurrency:
      group: ci-collector-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run collector tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    needs: collector
    runs-on: ubuntu-latest
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build production site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run editorial browser tests
        run: node tests/editorial.browser.mjs

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-browser-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: test-results/editorial
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}-${{ github.run_attempt }}
          path: docs
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
