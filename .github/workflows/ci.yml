name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  collector:
    # macOS is required: tests/test_daily_reconciliation.py exercises
    # scripts/launchd-run, which depends on /usr/bin/shlock (absent on Linux),
    # and macOS-specific publish/git behavior; 7 tests fail on Linux.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@users.noreply.github.com
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@users.noreply.github.com
    concurrency:
      group: ci-collector-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run collector tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    needs: collector
    runs-on: ubuntu-latest
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build production site
        run: npm run build

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  rerun-on-cancel:
    # Collector cancellation leaves frontend 'skipped' (not 'cancelled'), so
    # the collector clause is what recovers a cancelled macos-latest wait.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt < 3 && (needs.collector.result == 'cancelled' || needs.frontend.result == 'cancelled')
    needs: [collector, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun cancelled run unless superseded
        run: |
          current=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          if [ "$current" != "${{ github.sha }}" ]; then
            echo "Newer commit $current superseded this run (${{ github.sha }}); not rerunning."
            exit 0
          fi
          gh run rerun ${{ github.run_id }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
